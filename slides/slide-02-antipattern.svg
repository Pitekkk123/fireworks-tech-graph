<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090a"/>
      <stop offset="40%" stop-color="#0c0d0f"/>
      <stop offset="100%" stop-color="#08090a"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="rgba(255,240,240,0.02)"/>
      <stop offset="100%" stop-color="rgba(255,240,240,0)"/>
    </radialGradient>
    <linearGradient id="glass-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.015)"/>
    </linearGradient>
    <filter id="shadow-card" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#light)"/>

  <!-- Title area -->
  <text x="960" y="100" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="400" letter-spacing="0.25em">THE MISTAKE</text>
  <text x="960" y="170" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="52" font-weight="200" letter-spacing="-0.01em">One technology per layer</text>
  <text x="960" y="215" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="18" font-weight="300">The instinct to map each logical concern to a separate system</text>

  <!-- Five cards representing the overengineered approach -->
  <!-- Card 1: SQL -->
  <g filter="url(#shadow-card)">
    <rect x="140" y="290" width="300" height="320" rx="16" fill="url(#glass-fill)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <rect x="141" y="291" width="298" height="1" fill="rgba(255,255,255,0.06)"/>
    <text x="290" y="360" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="200">SQL</text>
    <text x="290" y="400" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="13" font-weight="400">PostgreSQL</text>
    <line x1="220" y1="430" x2="360" y2="430" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <text x="290" y="465" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="300">Canonical facts</text>
    <text x="290" y="485" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="300">Snapshots</text>
    <text x="290" y="505" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="300">Scores</text>
  </g>

  <!-- Card 2: Redis -->
  <g filter="url(#shadow-card)">
    <rect x="470" y="290" width="300" height="320" rx="16" fill="url(#glass-fill)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <rect x="471" y="291" width="298" height="1" fill="rgba(255,255,255,0.06)"/>
    <text x="620" y="360" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="200">Redis</text>
    <text x="620" y="400" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="13" font-weight="400">Upstash</text>
    <line x1="550" y1="430" x2="690" y2="430" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <text x="620" y="465" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="300">Hot views</text>
    <text x="620" y="485" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="300">Cache</text>
    <text x="620" y="505" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="300">Job locks</text>
  </g>

  <!-- Card 3: Blob -->
  <g filter="url(#shadow-card)">
    <rect x="800" y="290" width="300" height="320" rx="16" fill="url(#glass-fill)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <rect x="801" y="291" width="298" height="1" fill="rgba(255,255,255,0.06)"/>
    <text x="950" y="360" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="200">Blob</text>
    <text x="950" y="400" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="13" font-weight="400">Object Storage</text>
    <line x1="880" y1="430" x2="1020" y2="430" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <text x="950" y="465" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="300">Raw files</text>
    <text x="950" y="485" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="300">PDFs, HTML</text>
    <text x="950" y="505" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="300">CSV</text>
  </g>

  <!-- Card 4: Vector -->
  <g filter="url(#shadow-card)">
    <rect x="1130" y="290" width="300" height="320" rx="16" fill="url(#glass-fill)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <rect x="1131" y="291" width="298" height="1" fill="rgba(255,255,255,0.06)"/>
    <text x="1280" y="360" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="200">Vector</text>
    <text x="1280" y="400" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="13" font-weight="400">Pinecone / Qdrant</text>
    <line x1="1210" y1="430" x2="1350" y2="430" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <text x="1280" y="465" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="300">Embeddings</text>
    <text x="1280" y="485" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="300">Memory</text>
    <text x="1280" y="505" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="300">Retrieval</text>
  </g>

  <!-- Card 5: Archive -->
  <g filter="url(#shadow-card)">
    <rect x="1460" y="290" width="300" height="320" rx="16" fill="url(#glass-fill)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <rect x="1461" y="291" width="298" height="1" fill="rgba(255,255,255,0.06)"/>
    <text x="1610" y="360" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="200">Archive</text>
    <text x="1610" y="400" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="13" font-weight="400">Report Storage</text>
    <line x1="1540" y1="430" x2="1680" y2="430" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <text x="1610" y="465" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="300">Daily briefs</text>
    <text x="1610" y="485" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="300">Markdown</text>
    <text x="1610" y="505" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="300">JSON exports</text>
  </g>

  <!-- Strike-through line across all cards -->
  <line x1="120" y1="450" x2="1800" y2="450" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Bottom insight -->
  <text x="960" y="720" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="200" letter-spacing="-0.01em">Five moving parts. One problem.</text>

  <text x="960" y="780" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="15" font-weight="300">Synchronization nightmares. Debugging across systems. Cost without scale.</text>
  <text x="960" y="810" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="15" font-weight="300">Premature complexity for a system that processes 11 sectors daily.</text>

  <!-- Key statement -->
  <g transform="translate(560, 870)">
    <rect width="800" height="70" rx="14" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <text x="400" y="30" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="16" font-weight="300" font-style="italic">A logical layer does not require a physical technology.</text>
    <text x="400" y="52" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="13" font-weight="300">Schemas within one database serve the same purpose with zero coordination cost.</text>
  </g>

  <text x="960" y="1030" text-anchor="middle" fill="rgba(255,255,255,0.12)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="11" font-weight="400" letter-spacing="0.15em">02</text>
</svg>
