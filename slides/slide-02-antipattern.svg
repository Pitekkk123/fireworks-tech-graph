<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <style>
    text { font-family: 'Inter', -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow-red" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="rgba(248,81,73,0.12)"/>
      <stop offset="100%" stop-color="rgba(248,81,73,0)"/>
    </radialGradient>
    <radialGradient id="glow-blue" cx="20%" cy="30%" r="35%">
      <stop offset="0%" stop-color="rgba(88,166,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(88,166,255,0)"/>
    </radialGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f85149"/>
      <stop offset="100%" stop-color="#f78166"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(88,166,255,0.03)" stroke-width="0.5"/>
    </pattern>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#glow-red)"/>
  <rect width="1920" height="1080" fill="url(#glow-blue)"/>

  <!-- Section label -->
  <text x="960" y="80" text-anchor="middle" fill="rgba(248,81,73,0.6)" font-size="14" font-weight="600" letter-spacing="0.2em">THE ANTI-PATTERN</text>

  <!-- Title -->
  <text x="960" y="150" text-anchor="middle" fill="url(#title-grad)" font-size="56" font-weight="700" filter="url(#glow-filter)">5 Technologies for 5 Layers?</text>
  <text x="960" y="200" text-anchor="middle" fill="#8b949e" font-size="22" font-weight="400">Each logical layer does NOT require a separate technology</text>

  <!-- Five technology boxes with X marks -->
  <!-- Box 1: SQL -->
  <g transform="translate(160, 290)">
    <rect width="280" height="180" rx="12" fill="rgba(51,103,145,0.08)" stroke="rgba(248,81,73,0.3)" stroke-width="1.5"/>
    <circle cx="140" cy="60" r="28" fill="rgba(51,103,145,0.3)" stroke="#336791" stroke-width="1.5"/>
    <text x="140" y="67" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="700">SQL</text>
    <text x="140" y="110" text-anchor="middle" fill="#f0f6fc" font-size="18" font-weight="600">PostgreSQL</text>
    <text x="140" y="135" text-anchor="middle" fill="#8b949e" font-size="13">Canonical Facts</text>
    <text x="140" y="155" text-anchor="middle" fill="#8b949e" font-size="13">Snapshots, Scores</text>
    <!-- X mark -->
    <line x1="220" y1="20" x2="260" y2="55" stroke="#f85149" stroke-width="3" opacity="0.8"/>
    <line x1="260" y1="20" x2="220" y2="55" stroke="#f85149" stroke-width="3" opacity="0.8"/>
  </g>

  <!-- Box 2: Redis -->
  <g transform="translate(480, 290)">
    <rect width="280" height="180" rx="12" fill="rgba(220,56,45,0.06)" stroke="rgba(248,81,73,0.3)" stroke-width="1.5"/>
    <circle cx="140" cy="60" r="28" fill="rgba(220,56,45,0.3)" stroke="#DC382D" stroke-width="1.5"/>
    <text x="140" y="67" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="700">KV</text>
    <text x="140" y="110" text-anchor="middle" fill="#f0f6fc" font-size="18" font-weight="600">Redis / Upstash</text>
    <text x="140" y="135" text-anchor="middle" fill="#8b949e" font-size="13">Hot Views, Cache</text>
    <text x="140" y="155" text-anchor="middle" fill="#8b949e" font-size="13">Job Locks</text>
    <line x1="220" y1="20" x2="260" y2="55" stroke="#f85149" stroke-width="3" opacity="0.8"/>
    <line x1="260" y1="20" x2="220" y2="55" stroke="#f85149" stroke-width="3" opacity="0.8"/>
  </g>

  <!-- Box 3: Blob -->
  <g transform="translate(800, 290)">
    <rect width="280" height="180" rx="12" fill="rgba(63,185,80,0.06)" stroke="rgba(248,81,73,0.3)" stroke-width="1.5"/>
    <circle cx="140" cy="60" r="28" fill="rgba(63,185,80,0.3)" stroke="#3fb950" stroke-width="1.5"/>
    <text x="140" y="67" text-anchor="middle" fill="#f0f6fc" font-size="14" font-weight="700">BLOB</text>
    <text x="140" y="110" text-anchor="middle" fill="#f0f6fc" font-size="18" font-weight="600">Object Storage</text>
    <text x="140" y="135" text-anchor="middle" fill="#8b949e" font-size="13">Raw Files, PDFs</text>
    <text x="140" y="155" text-anchor="middle" fill="#8b949e" font-size="13">HTML, CSV</text>
    <line x1="220" y1="20" x2="260" y2="55" stroke="#f85149" stroke-width="3" opacity="0.8"/>
    <line x1="260" y1="20" x2="220" y2="55" stroke="#f85149" stroke-width="3" opacity="0.8"/>
  </g>

  <!-- Box 4: Vector -->
  <g transform="translate(1120, 290)">
    <rect width="280" height="180" rx="12" fill="rgba(124,58,237,0.06)" stroke="rgba(248,81,73,0.3)" stroke-width="1.5"/>
    <circle cx="140" cy="60" r="28" fill="rgba(124,58,237,0.3)" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="140" y="67" text-anchor="middle" fill="#f0f6fc" font-size="14" font-weight="700">VEC</text>
    <text x="140" y="110" text-anchor="middle" fill="#f0f6fc" font-size="18" font-weight="600">Vector DB</text>
    <text x="140" y="135" text-anchor="middle" fill="#8b949e" font-size="13">Memory / Retrieval</text>
    <text x="140" y="155" text-anchor="middle" fill="#8b949e" font-size="13">Embeddings</text>
    <line x1="220" y1="20" x2="260" y2="55" stroke="#f85149" stroke-width="3" opacity="0.8"/>
    <line x1="260" y1="20" x2="220" y2="55" stroke="#f85149" stroke-width="3" opacity="0.8"/>
  </g>

  <!-- Box 5: Archive -->
  <g transform="translate(1440, 290)">
    <rect width="280" height="180" rx="12" fill="rgba(247,129,102,0.06)" stroke="rgba(248,81,73,0.3)" stroke-width="1.5"/>
    <circle cx="140" cy="60" r="28" fill="rgba(247,129,102,0.3)" stroke="#f78166" stroke-width="1.5"/>
    <text x="140" y="67" text-anchor="middle" fill="#f0f6fc" font-size="12" font-weight="700">ARCH</text>
    <text x="140" y="110" text-anchor="middle" fill="#f0f6fc" font-size="18" font-weight="600">Report Archive</text>
    <text x="140" y="135" text-anchor="middle" fill="#8b949e" font-size="13">Daily Briefs</text>
    <text x="140" y="155" text-anchor="middle" fill="#8b949e" font-size="13">Markdown/JSON</text>
    <line x1="220" y1="20" x2="260" y2="55" stroke="#f85149" stroke-width="3" opacity="0.8"/>
    <line x1="260" y1="20" x2="220" y2="55" stroke="#f85149" stroke-width="3" opacity="0.8"/>
  </g>

  <!-- Big X overlay -->
  <line x1="200" y1="280" x2="1700" y2="480" stroke="#f85149" stroke-width="4" opacity="0.2" stroke-dasharray="12,6"/>
  <line x1="1700" y1="280" x2="200" y2="480" stroke="#f85149" stroke-width="4" opacity="0.2" stroke-dasharray="12,6"/>

  <!-- Problem statement glass card -->
  <g transform="translate(260, 540)">
    <rect width="1400" height="220" rx="16" fill="rgba(248,81,73,0.04)" stroke="rgba(248,81,73,0.2)" stroke-width="1"/>
    <rect width="1400" height="1" y="0" rx="0" fill="rgba(255,255,255,0.06)"/>

    <!-- Left column: Problems -->
    <text x="60" y="45" fill="#f85149" font-size="16" font-weight="600" letter-spacing="0.1em">PROBLEMS WITH THIS APPROACH</text>

    <circle cx="60" cy="85" r="4" fill="#f85149" opacity="0.6"/>
    <text x="80" y="90" fill="#f0f6fc" font-size="16" font-weight="400">5 separate systems to maintain, monitor, and debug</text>

    <circle cx="60" cy="120" r="4" fill="#f85149" opacity="0.6"/>
    <text x="80" y="125" fill="#f0f6fc" font-size="16" font-weight="400">Data synchronization nightmares between stores</text>

    <circle cx="60" cy="155" r="4" fill="#f85149" opacity="0.6"/>
    <text x="80" y="160" fill="#f0f6fc" font-size="16" font-weight="400">Premature complexity before real scale problems exist</text>

    <circle cx="60" cy="190" r="4" fill="#f85149" opacity="0.6"/>
    <text x="80" y="195" fill="#f0f6fc" font-size="16" font-weight="400">Higher cost, slower development, harder auditing</text>

    <!-- Right column: Truth -->
    <line x1="780" y1="30" x2="780" y2="200" stroke="rgba(248,81,73,0.15)" stroke-width="1"/>
    <text x="820" y="45" fill="#f78166" font-size="16" font-weight="600" letter-spacing="0.1em">KEY TRUTH</text>

    <text x="820" y="95" fill="#f0f6fc" font-size="22" font-weight="600">Logical Layer</text>
    <text x="1050" y="95" fill="#f85149" font-size="28" font-weight="700">=</text>
    <text x="1090" y="95" fill="#f0f6fc" font-size="22" font-weight="600">Separate Technology</text>
    <!-- Strikethrough -->
    <line x1="1078" y1="88" x2="1320" y2="88" stroke="#f85149" stroke-width="2.5"/>

    <text x="820" y="145" fill="#8b949e" font-size="16" font-weight="400">One Postgres instance can serve</text>
    <text x="820" y="170" fill="#8b949e" font-size="16" font-weight="400">all 5 logical layers internally</text>
    <text x="820" y="195" fill="#8b949e" font-size="16" font-weight="400">with schemas, tables, and JSONB</text>
  </g>

  <!-- Bottom quote -->
  <text x="960" y="850" text-anchor="middle" fill="rgba(248,81,73,0.5)" font-size="42" font-weight="300" font-style="italic">"</text>
  <text x="960" y="890" text-anchor="middle" fill="#8b949e" font-size="20" font-weight="400" font-style="italic">The biggest mistake is adding technology</text>
  <text x="960" y="920" text-anchor="middle" fill="#8b949e" font-size="20" font-weight="400" font-style="italic">before a real problem appears.</text>
  <text x="960" y="950" text-anchor="middle" fill="rgba(248,81,73,0.5)" font-size="42" font-weight="300" font-style="italic">"</text>

  <!-- Slide number -->
  <text x="1880" y="1050" text-anchor="end" fill="rgba(139,148,158,0.3)" font-size="14" font-weight="400">02 / 10</text>
</svg>
