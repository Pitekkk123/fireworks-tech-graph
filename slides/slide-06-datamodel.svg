  <text x="160" y="136" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="14" font-weight="300" fill="rgba(255,255,255,0.35)" letter-spacing="0.12em">FOUR LAYERS  /  16 CORE TABLES</text>

