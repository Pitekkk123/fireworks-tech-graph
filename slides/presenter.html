<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TickerLab Architecture — Slide Deck</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1117;
      color: #f0f6fc;
      font-family: 'Inter', -apple-system, 'SF Pro Display', sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .slide-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .slide-container object,
    .slide-container img {
      max-width: 100vw;
      max-height: 100vh;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      align-items: center;
      background: rgba(22, 27, 34, 0.9);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 8px 20px;
      backdrop-filter: blur(12px);
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
    }
    body:hover .controls,
    .controls:hover { opacity: 1; }
    .controls button {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      color: #f0f6fc;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      transition: background 0.2s, border-color 0.2s;
    }
    .controls button:hover {
      background: rgba(88,166,255,0.15);
      border-color: rgba(88,166,255,0.4);
    }
    .controls button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .slide-counter {
      color: #8b949e;
      font-size: 13px;
      min-width: 60px;
      text-align: center;
    }
    .slide-title {
      color: #58a6ff;
      font-size: 12px;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .fullscreen-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1001;
      opacity: 0;
      transition: opacity 0.3s;
    }
    body:hover .fullscreen-btn { opacity: 1; }
    .fullscreen-btn button {
      background: rgba(22, 27, 34, 0.9);
      border: 1px solid rgba(255,255,255,0.1);
      color: #8b949e;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
    }
    .fullscreen-btn button:hover { color: #f0f6fc; border-color: rgba(88,166,255,0.4); }
    .progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, #58a6ff, #bc8cff, #3fb950);
      transition: width 0.3s ease;
      z-index: 1002;
    }
    .keyboard-hint {
      position: fixed;
      top: 16px;
      left: 16px;
      color: rgba(139,148,158,0.4);
      font-size: 11px;
      z-index: 1001;
      opacity: 0;
      transition: opacity 0.3s;
    }
    body:hover .keyboard-hint { opacity: 1; }
  </style>
</head>
<body>
  <div class="progress-bar" id="progress"></div>
  <div class="keyboard-hint">Arrow keys or click to navigate</div>
  <div class="fullscreen-btn">
    <button onclick="toggleFullscreen()">Fullscreen</button>
  </div>

  <div class="slide-container" id="slideContainer">
    <object id="slideObject" type="image/svg+xml" data="slide-01-title.svg"></object>
  </div>

  <div class="controls">
    <button id="prevBtn" onclick="prevSlide()">&larr; Prev</button>
    <span class="slide-counter" id="counter">1 / 10</span>
    <button id="nextBtn" onclick="nextSlide()">Next &rarr;</button>
    <span class="slide-title" id="slideTitle">Title</span>
  </div>

  <script>
    const slides = [
      { file: 'slide-01-title.svg', title: 'TickerLab Architecture' },
      { file: 'slide-02-antipattern.svg', title: 'The Anti-Pattern' },
      { file: 'slide-03-insight.svg', title: 'Key Insight: 5 = 2' },
      { file: 'slide-04-architecture.svg', title: 'Core Architecture' },
      { file: 'slide-05-schemas.svg', title: 'Schema Universe' },
      { file: 'slide-06-datamodel.svg', title: '16 Core Tables' },
      { file: 'slide-07-etl-pipeline.svg', title: 'ETL Pipeline' },
      { file: 'slide-08-daily-flow.svg', title: 'Daily Refresh Flow' },
      { file: 'slide-09-roadmap.svg', title: 'Evolution Roadmap' },
      { file: 'slide-10-principles.svg', title: 'Design Principles' }
    ];

    let current = 0;

    function showSlide(index) {
      current = Math.max(0, Math.min(slides.length - 1, index));
      const obj = document.getElementById('slideObject');
      obj.data = slides[current].file;
      document.getElementById('counter').textContent = `${current + 1} / ${slides.length}`;
      document.getElementById('slideTitle').textContent = slides[current].title;
      document.getElementById('prevBtn').disabled = current === 0;
      document.getElementById('nextBtn').disabled = current === slides.length - 1;
      document.getElementById('progress').style.width = `${((current + 1) / slides.length) * 100}%`;
    }

    function nextSlide() { showSlide(current + 1); }
    function prevSlide() { showSlide(current - 1); }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); nextSlide(); }
      if (e.key === 'ArrowLeft' || e.key === 'Backspace' || e.key === 'PageUp') { e.preventDefault(); prevSlide(); }
      if (e.key === 'Home') { e.preventDefault(); showSlide(0); }
      if (e.key === 'End') { e.preventDefault(); showSlide(slides.length - 1); }
      if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); }
    });

    document.getElementById('slideContainer').addEventListener('click', (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const x = e.clientX - rect.left;
      if (x > rect.width / 2) nextSlide();
      else prevSlide();
    });

    showSlide(0);
  </script>
</body>
</html>
