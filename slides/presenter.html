<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TickerLab Architecture</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #110f0c; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'SF Pro Display', 'Inter', -apple-system, sans-serif;
    }
    .slide-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .slide-container object {
      max-width: 100vw;
      max-height: 100vh;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.45s ease;
    }
    .slide-container object.loaded { opacity: 1; }
    .controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(26,20,16,0.85);
      border: 1px solid rgba(217,119,87,0.12);
      border-radius: 14px;
      padding: 8px 20px;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.3s;
    }
    body:hover .controls { opacity: 1; }
    .controls button {
      background: rgba(217,119,87,0.08);
      border: 1px solid rgba(217,119,87,0.15);
      color: rgba(245,240,235,0.5);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .controls button:hover {
      background: rgba(217,119,87,0.18);
      color: rgba(245,240,235,0.85);
      border-color: rgba(217,119,87,0.3);
    }
    .counter {
      color: rgba(217,119,87,0.45);
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.1em;
      min-width: 60px;
      text-align: center;
    }
    .progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      background: linear-gradient(90deg, #D97757, #E8A88A);
      transition: width 0.35s ease;
      z-index: 10;
    }
    .hint {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(217,119,87,0.2);
      font-size: 11px;
      letter-spacing: 0.1em;
      transition: opacity 2s;
      pointer-events: none;
    }
    .hint.hidden { opacity: 0; }
  </style>
</head>
<body>
  <div class="progress" id="progress"></div>
  <div class="slide-container" id="container"></div>
  <div class="controls">
    <button id="prev" title="Previous">&#8592;</button>
    <span class="counter" id="counter">1 / 10</span>
    <button id="next" title="Next">&#8594;</button>
    <button id="fs" title="Fullscreen (F)">&#x26F6;</button>
  </div>
  <div class="hint" id="hint">Arrow keys to navigate &middot; F for fullscreen</div>

  <script>
    const slides = [
      'slide-01-title.svg',
      'slide-02-antipattern.svg',
      'slide-03-insight.svg',
      'slide-04-architecture.svg',
      'slide-05-schemas.svg',
      'slide-06-datamodel.svg',
      'slide-07-etl-pipeline.svg',
      'slide-08-daily-flow.svg',
      'slide-09-roadmap.svg',
      'slide-10-principles.svg'
    ];
    let current = 0;
    const container = document.getElementById('container');
    const counter = document.getElementById('counter');
    const progress = document.getElementById('progress');
    const hint = document.getElementById('hint');

    function show(idx) {
      current = Math.max(0, Math.min(slides.length - 1, idx));
      container.innerHTML = '';
      const obj = document.createElement('object');
      obj.type = 'image/svg+xml';
      obj.data = slides[current];
      obj.style.maxWidth = '100vw';
      obj.style.maxHeight = '100vh';
      obj.style.width = '100%';
      obj.style.height = '100%';
      obj.style.objectFit = 'contain';
      obj.onload = () => obj.classList.add('loaded');
      container.appendChild(obj);
      counter.textContent = `${current + 1} / ${slides.length}`;
      progress.style.width = `${((current + 1) / slides.length) * 100}%`;
    }

    document.addEventListener('keydown', e => {
      hint.classList.add('hidden');
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); show(current + 1); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(current - 1); }
      else if (e.key === 'Home') { show(0); }
      else if (e.key === 'End') { show(slides.length - 1); }
      else if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      }
    });

    container.addEventListener('click', e => {
      hint.classList.add('hidden');
      const rect = container.getBoundingClientRect();
      if (e.clientX > rect.left + rect.width / 2) show(current + 1);
      else show(current - 1);
    });

    document.getElementById('prev').addEventListener('click', () => show(current - 1));
    document.getElementById('next').addEventListener('click', () => show(current + 1));
    document.getElementById('fs').addEventListener('click', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    });

    setTimeout(() => hint.classList.add('hidden'), 4000);
    show(0);
  </script>
</body>
</html>
