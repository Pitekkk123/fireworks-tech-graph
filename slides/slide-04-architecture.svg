  <text x="1220" y="620" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="16" font-weight="300" fill="rgba(245,240,235,0.7)">HTML snapshots</text>
  <text x="1220" y="655" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="16" font-weight="300" fill="rgba(245,240,235,0.7)">JSON payloads</text>
  <text x="1220" y="690" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="16" font-weight="300" fill="rgba(245,240,235,0.7)">CSV exports</text>
  <text x="1220" y="725" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="16" font-weight="300" fill="rgba(245,240,235,0.7)">Email archives (.eml)</text>
  <text x="1220" y="760" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="16" font-weight="300" fill="rgba(245,240,235,0.7)">API response logs</text>

