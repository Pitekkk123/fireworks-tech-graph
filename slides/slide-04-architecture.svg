  <text x="160" y="148" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="14" font-weight="500" fill="#D97757" letter-spacing="0.25em">TICKERLAB STORAGE LAYER</text>

  <!-- External Sources Bar -->
