  <text x="900" y="992" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(245,240,235,0.3)">REST API</text>
  <text x="1060" y="992" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(245,240,235,0.3)">Ticker Explain</text>

  <!-- Slide number -->
  <text x="960" y="1055" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="14" font-weight="300" fill="rgba(217,119,87,0.25)" letter-spacing="0.15em" text-anchor="middle">04 / 10</text>
