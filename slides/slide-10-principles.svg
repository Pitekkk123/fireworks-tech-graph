<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090a"/>
      <stop offset="100%" stop-color="#0c0d0f"/>
    </linearGradient>
    <radialGradient id="atmo10" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.02)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <linearGradient id="glass10" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.04)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.012)"/>
    </linearGradient>
    <filter id="shadow10">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg10)"/>
  <rect width="1920" height="1080" fill="url(#atmo10)"/>

  <!-- Title -->
  <text x="960" y="70" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="400" fill="rgba(255,255,255,0.2)" letter-spacing="0.25em">MANIFESTO</text>
  <text x="960" y="125" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="48" font-weight="200" fill="rgba(255,255,255,0.85)">Design Principles</text>

  <!-- 2x3 Grid of principle cards -->
  <!-- Row 1 -->
  <!-- Principle 1 -->
  <g filter="url(#shadow10)">
    <rect x="140" y="180" width="520" height="210" rx="16" fill="url(#glass10)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <line x1="156" y1="180" x2="644" y2="180" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </g>
  <text x="180" y="220" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="48" font-weight="100" fill="rgba(255,255,255,0.06)">01</text>
  <text x="250" y="220" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="17" font-weight="400" fill="rgba(255,255,255,0.7)">report_snapshots &gt; Redis</text>
  <text x="180" y="260" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.3)">Pre-compute the daily brief once after market close.</text>
  <text x="180" y="280" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.3)">Frontend reads one JSON row. &lt; 5ms indexed.</text>
  <text x="180" y="310" font-family="'SF Mono','JetBrains Mono',monospace" font-size="11" font-weight="300" fill="rgba(255,255,255,0.15)">SELECT report_json WHERE asof_date = today</text>
  <text x="180" y="360" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,0.15)">No Redis needed for daily-frequency data.</text>

  <!-- Principle 2 -->
  <g filter="url(#shadow10)">
    <rect x="700" y="180" width="520" height="210" rx="16" fill="url(#glass10)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <line x1="716" y1="180" x2="1204" y2="180" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </g>
  <text x="740" y="220" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="48" font-weight="100" fill="rgba(255,255,255,0.06)">02</text>
  <text x="810" y="220" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="17" font-weight="400" fill="rgba(255,255,255,0.7)">job_runs &gt; Redis state</text>
  <text x="740" y="260" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.3)">Track pipeline status with UNIQUE(job_name, asof_date).</text>
  <text x="740" y="280" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.3)">Prevents duplicate runs without distributed locks.</text>
  <text x="740" y="310" font-family="'SF Mono','JetBrains Mono',monospace" font-size="11" font-weight="300" fill="rgba(255,255,255,0.15)">INSERT ... ON CONFLICT DO NOTHING</text>
  <text x="740" y="360" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,0.15)">Redis locks for single-worker pipeline? Overkill.</text>

  <!-- Principle 3 -->
  <g filter="url(#shadow10)">
    <rect x="1260" y="180" width="520" height="210" rx="16" fill="url(#glass10)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <line x1="1276" y1="180" x2="1764" y2="180" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </g>
  <text x="1300" y="220" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="48" font-weight="100" fill="rgba(255,255,255,0.06)">03</text>
  <text x="1370" y="220" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="17" font-weight="400" fill="rgba(255,255,255,0.7)">document_chunks &gt; Vector DB</text>
  <text x="1300" y="260" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.3)">Start with keyword search on ticker/topic/source.</text>
  <text x="1300" y="280" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.3)">Add pgvector embedding column when needed.</text>
  <text x="1300" y="310" font-family="'SF Mono','JetBrains Mono',monospace" font-size="11" font-weight="300" fill="rgba(255,255,255,0.15)">WHERE ticker=$1 AND topic ILIKE $2</text>
  <text x="1300" y="360" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,0.15)">Separate vector DB only at extreme document scale.</text>

  <!-- Row 2 -->
  <!-- Principle 4 -->
  <g filter="url(#shadow10)">
    <rect x="140" y="430" width="520" height="210" rx="16" fill="url(#glass10)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <line x1="156" y1="430" x2="644" y2="430" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </g>
  <text x="180" y="470" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="48" font-weight="100" fill="rgba(255,255,255,0.06)">04</text>
  <text x="250" y="470" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="17" font-weight="400" fill="rgba(255,255,255,0.7)">pending_outcomes &gt; Redis queue</text>
  <text x="180" y="510" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.3)">Outcomes resolve on schedule, not real-time.</text>
  <text x="180" y="530" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.3)">Daily cron queries pending rows. ~100/day.</text>
  <text x="180" y="560" font-family="'SF Mono','JetBrains Mono',monospace" font-size="11" font-weight="300" fill="rgba(255,255,255,0.15)">WHERE due_date &lt;= TODAY AND status = 'pending'</text>
  <text x="180" y="610" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,0.15)">No Kafka. No SQS. SQL is plenty.</text>

  <!-- Principle 5 -->
  <g filter="url(#shadow10)">
    <rect x="700" y="430" width="520" height="210" rx="16" fill="url(#glass10)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <line x1="716" y1="430" x2="1204" y2="430" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </g>
  <text x="740" y="470" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="48" font-weight="100" fill="rgba(255,255,255,0.06)">05</text>
  <text x="810" y="470" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="17" font-weight="400" fill="rgba(255,255,255,0.7)">Logical Layer != Technology</text>
  <text x="740" y="510" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.3)">Five conceptual layers exist as Postgres schemas,</text>
  <text x="740" y="530" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.3)">not as five separate running services.</text>
  <text x="740" y="570" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.25)">One backup. One connection. One audit trail.</text>
  <text x="740" y="610" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,0.15)">Before: 5 systems. After: 2 systems, same logic.</text>

  <!-- Principle 6 -->
  <g filter="url(#shadow10)">
    <rect x="1260" y="430" width="520" height="210" rx="16" fill="url(#glass10)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <line x1="1276" y1="430" x2="1764" y2="430" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </g>
  <text x="1300" y="470" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="48" font-weight="100" fill="rgba(255,255,255,0.06)">06</text>
  <text x="1370" y="470" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="17" font-weight="400" fill="rgba(255,255,255,0.7)">ETL Agent, not Memory Agent</text>
  <text x="1300" y="510" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.3)">The agent is a deterministic pipeline:</text>
  <text x="1300" y="530" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.3)">Extract, Transform, Load, Report.</text>
  <text x="1300" y="570" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.25)">No autonomous "memory decisions." Predictable.</text>
  <text x="1300" y="610" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,0.15)">Controlled worker, not magical brain.</text>

  <!-- Bottom closing statement -->
  <text x="960" y="750" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="26" font-weight="200" fill="rgba(255,255,255,0.6)" letter-spacing="-0.01em">Add technology only when a real problem appears.</text>

  <line x1="760" y1="790" x2="1160" y2="790" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <text x="960" y="840" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="14" font-weight="300" fill="rgba(255,255,255,0.2)">The biggest mistake is premature infrastructure complexity.</text>
  <text x="960" y="870" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="14" font-weight="300" fill="rgba(255,255,255,0.2)">Build what you need. Scale when you must.</text>

  <!-- Final branding -->
  <text x="960" y="960" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="20" font-weight="200" fill="rgba(255,255,255,0.35)">TickerLab Storage Architecture v1</text>
  <text x="960" y="988" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.15)">Pragmatic. Auditable. Scalable when needed.</text>

  <text x="960" y="1040" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="400" fill="rgba(255,255,255,0.12)" letter-spacing="0.15em">10</text>
</svg>
