<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="50%" stop-color="#14110e"/>
      <stop offset="100%" stop-color="#110f0c"/>
    </linearGradient>
    <radialGradient id="glow-warm" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(217,119,87,0.06)"/>
      <stop offset="100%" stop-color="rgba(217,119,87,0)"/>
    </radialGradient>
    <radialGradient id="glow-soft" cx="70%" cy="70%" r="45%">
      <stop offset="0%" stop-color="rgba(232,168,138,0.03)"/>
      <stop offset="100%" stop-color="rgba(232,168,138,0)"/>
    </radialGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(245,240,235,0.05)"/>
      <stop offset="100%" stop-color="rgba(245,240,235,0.015)"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#E8A88A"/>
    </linearGradient>
    <filter id="shadow-deep">
      <feDropShadow dx="0" dy="10" stdDeviation="24" flood-color="rgba(10,8,6,0.5)"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow-warm)"/>
  <rect width="1920" height="1080" fill="url(#glow-soft)"/>

  <!-- Main glass panel -->
  <rect x="410" y="260" width="1100" height="520" rx="28" fill="url(#glass)" stroke="rgba(217,119,87,0.1)" stroke-width="1" filter="url(#shadow-deep)"/>
  <rect x="411" y="261" width="1098" height="1" fill="rgba(245,240,235,0.06)"/>

  <!-- Overline with accent -->
  <text x="960" y="340" text-anchor="middle" fill="#D97757" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="500" letter-spacing="0.3em">SYSTEM ARCHITECTURE</text>

  <!-- Main title -->
  <text x="960" y="440" text-anchor="middle" fill="rgba(245,240,235,0.92)" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="76" font-weight="200" letter-spacing="-0.02em">TickerLab</text>

  <!-- Subtitle -->
  <text x="960" y="510" text-anchor="middle" fill="rgba(245,240,235,0.45)" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="26" font-weight="300" letter-spacing="0.08em">Storage Architecture</text>

  <!-- Accent line -->
  <line x1="880" y1="555" x2="1040" y2="555" stroke="url(#accent-grad)" stroke-width="1.5" opacity="0.4"/>

  <!-- Tagline -->
  <text x="960" y="605" text-anchor="middle" fill="rgba(245,240,235,0.28)" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="16" font-weight="300">Pragmatic infrastructure for financial intelligence</text>

  <!-- Stats row -->
  <g transform="translate(560, 670)">
    <text x="0" y="0" fill="#D97757" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="38" font-weight="200">2</text>
    <text x="0" y="24" fill="rgba(245,240,235,0.25)" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="400" letter-spacing="0.12em">STORAGE</text>
  </g>
  <line x1="690" y1="655" x2="690" y2="700" stroke="rgba(217,119,87,0.1)" stroke-width="1"/>
  <g transform="translate(740, 670)">
    <text x="0" y="0" fill="#D97757" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="38" font-weight="200">5</text>
    <text x="0" y="24" fill="rgba(245,240,235,0.25)" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="400" letter-spacing="0.12em">LAYERS</text>
  </g>
  <line x1="860" y1="655" x2="860" y2="700" stroke="rgba(217,119,87,0.1)" stroke-width="1"/>
  <g transform="translate(910, 670)">
    <text x="0" y="0" fill="#D97757" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="38" font-weight="200">16</text>
    <text x="0" y="24" fill="rgba(245,240,235,0.25)" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="400" letter-spacing="0.12em">TABLES</text>
  </g>
  <line x1="1060" y1="655" x2="1060" y2="700" stroke="rgba(217,119,87,0.1)" stroke-width="1"/>
  <g transform="translate(1110, 670)">
    <text x="0" y="0" fill="#D97757" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="38" font-weight="200">12</text>
    <text x="0" y="24" fill="rgba(245,240,235,0.25)" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="400" letter-spacing="0.12em">SCHEMAS</text>
  </g>

  <text x="960" y="1040" text-anchor="middle" fill="rgba(217,119,87,0.25)" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="400" letter-spacing="0.15em">01 / 10</text>
</svg>
