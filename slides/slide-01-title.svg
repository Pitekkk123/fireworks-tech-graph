<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <style>
    text { font-family: 'Inter', -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow-blue" cx="25%" cy="35%" r="45%">
      <stop offset="0%" stop-color="rgba(88,166,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(88,166,255,0)"/>
    </radialGradient>
    <radialGradient id="glow-purple" cx="75%" cy="65%" r="40%">
      <stop offset="0%" stop-color="rgba(188,140,255,0.14)"/>
      <stop offset="100%" stop-color="rgba(188,140,255,0)"/>
    </radialGradient>
    <radialGradient id="glow-green" cx="50%" cy="90%" r="30%">
      <stop offset="0%" stop-color="rgba(63,185,80,0.08)"/>
      <stop offset="100%" stop-color="rgba(63,185,80,0)"/>
    </radialGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="subtitle-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(88,166,255,0)"/>
      <stop offset="20%" stop-color="rgba(88,166,255,0.6)"/>
      <stop offset="50%" stop-color="rgba(188,140,255,0.6)"/>
      <stop offset="80%" stop-color="rgba(63,185,80,0.6)"/>
      <stop offset="100%" stop-color="rgba(63,185,80,0)"/>
    </linearGradient>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(88,166,255,0.04)" stroke-width="0.5"/>
    </pattern>
    <!-- Postgres icon cylinder -->
    <linearGradient id="pg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#336791"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#glow-blue)"/>
  <rect width="1920" height="1080" fill="url(#glow-purple)"/>
  <rect width="1920" height="1080" fill="url(#glow-green)"/>

  <!-- Decorative floating elements -->
  <!-- Top-left data nodes -->
  <g opacity="0.12">
    <rect x="120" y="100" width="80" height="50" rx="6" fill="none" stroke="#58a6ff" stroke-width="1"/>
    <rect x="60" y="180" width="100" height="40" rx="6" fill="none" stroke="#bc8cff" stroke-width="1"/>
    <rect x="180" y="170" width="70" height="45" rx="6" fill="none" stroke="#3fb950" stroke-width="1"/>
    <line x1="160" y1="150" x2="110" y2="180" stroke="#58a6ff" stroke-width="0.8"/>
    <line x1="200" y1="150" x2="215" y2="170" stroke="#bc8cff" stroke-width="0.8"/>
  </g>

  <!-- Top-right data nodes -->
  <g opacity="0.12">
    <rect x="1680" y="120" width="90" height="50" rx="6" fill="none" stroke="#58a6ff" stroke-width="1"/>
    <rect x="1720" y="200" width="80" height="40" rx="6" fill="none" stroke="#f78166" stroke-width="1"/>
    <rect x="1620" y="190" width="70" height="50" rx="6" fill="none" stroke="#3fb950" stroke-width="1"/>
    <line x1="1725" y1="170" x2="1760" y2="200" stroke="#58a6ff" stroke-width="0.8"/>
    <line x1="1690" y1="190" x2="1655" y2="190" stroke="#3fb950" stroke-width="0.8"/>
  </g>

  <!-- Bottom decorative cylinders (databases) -->
  <g opacity="0.08" transform="translate(200, 850)">
    <ellipse cx="40" cy="0" rx="40" ry="12" fill="none" stroke="#336791" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="50" stroke="#336791" stroke-width="1.5"/>
    <line x1="80" y1="0" x2="80" y2="50" stroke="#336791" stroke-width="1.5"/>
    <ellipse cx="40" cy="50" rx="40" ry="12" fill="none" stroke="#336791" stroke-width="1.5"/>
  </g>
  <g opacity="0.08" transform="translate(1650, 830)">
    <ellipse cx="40" cy="0" rx="40" ry="12" fill="none" stroke="#336791" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="50" stroke="#336791" stroke-width="1.5"/>
    <line x1="80" y1="0" x2="80" y2="50" stroke="#336791" stroke-width="1.5"/>
    <ellipse cx="40" cy="50" rx="40" ry="12" fill="none" stroke="#336791" stroke-width="1.5"/>
  </g>

  <!-- Central content area -->
  <!-- Main title -->
  <text x="960" y="340" text-anchor="middle" fill="url(#title-grad)" font-size="96" font-weight="700" letter-spacing="-0.02em" filter="url(#glow-filter)">TickerLab</text>
  <text x="960" y="430" text-anchor="middle" fill="url(#title-grad)" font-size="52" font-weight="600" letter-spacing="0.08em" opacity="0.9">STORAGE ARCHITECTURE</text>

  <!-- Decorative line -->
  <line x1="560" y1="470" x2="1360" y2="470" stroke="url(#line-grad)" stroke-width="2"/>

  <!-- Subtitle -->
  <text x="960" y="530" text-anchor="middle" fill="#8b949e" font-size="28" font-weight="400" letter-spacing="0.04em">Pragmatic Storage for Financial Intelligence</text>

  <!-- Key stat cards -->
  <!-- Card 1: 2 Storage -->
  <g transform="translate(440, 600)">
    <rect width="240" height="120" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(88,166,255,0.25)" stroke-width="1"/>
    <rect width="240" height="1" y="0" rx="0" fill="rgba(255,255,255,0.1)"/>
    <text x="120" y="55" text-anchor="middle" fill="#58a6ff" font-size="42" font-weight="700">2</text>
    <text x="120" y="85" text-anchor="middle" fill="#8b949e" font-size="16" font-weight="500" letter-spacing="0.06em">PHYSICAL STORAGE</text>
  </g>

  <!-- Card 2: 5 Layers -->
  <g transform="translate(740, 600)">
    <rect width="240" height="120" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(188,140,255,0.25)" stroke-width="1"/>
    <rect width="240" height="1" y="0" rx="0" fill="rgba(255,255,255,0.1)"/>
    <text x="120" y="55" text-anchor="middle" fill="#bc8cff" font-size="42" font-weight="700">5</text>
    <text x="120" y="85" text-anchor="middle" fill="#8b949e" font-size="16" font-weight="500" letter-spacing="0.06em">LOGICAL LAYERS</text>
  </g>

  <!-- Card 3: 16 Tables -->
  <g transform="translate(1040, 600)">
    <rect width="240" height="120" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(63,185,80,0.25)" stroke-width="1"/>
    <rect width="240" height="1" y="0" rx="0" fill="rgba(255,255,255,0.1)"/>
    <text x="120" y="55" text-anchor="middle" fill="#3fb950" font-size="42" font-weight="700">16</text>
    <text x="120" y="85" text-anchor="middle" fill="#8b949e" font-size="16" font-weight="500" letter-spacing="0.06em">CORE TABLES</text>
  </g>

  <!-- Card 4: 12 Schemas -->
  <g transform="translate(1240, 600)">
    <rect width="240" height="120" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(247,129,102,0.25)" stroke-width="1"/>
    <rect width="240" height="1" y="0" rx="0" fill="rgba(255,255,255,0.1)"/>
    <text x="120" y="55" text-anchor="middle" fill="#f78166" font-size="42" font-weight="700">12</text>
    <text x="120" y="85" text-anchor="middle" fill="#8b949e" font-size="16" font-weight="500" letter-spacing="0.06em">PG SCHEMAS</text>
  </g>

  <!-- Bottom tagline -->
  <text x="960" y="820" text-anchor="middle" fill="rgba(139,148,158,0.6)" font-size="18" font-weight="400" letter-spacing="0.1em">ANTI-OVERENGINEERING APPROACH</text>

  <!-- Technology badges -->
  <g transform="translate(770, 880)">
    <!-- Postgres badge -->
    <rect width="160" height="44" rx="22" fill="rgba(51,103,145,0.2)" stroke="rgba(51,103,145,0.5)" stroke-width="1"/>
    <circle cx="28" cy="22" r="14" fill="#336791"/>
    <text x="28" y="27" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">PG</text>
    <text x="100" y="27" text-anchor="middle" fill="#f0f6fc" font-size="15" font-weight="500">PostgreSQL</text>
  </g>
  <g transform="translate(960, 880)">
    <!-- Raw Archive badge -->
    <rect width="180" height="44" rx="22" fill="rgba(63,185,80,0.15)" stroke="rgba(63,185,80,0.4)" stroke-width="1"/>
    <circle cx="28" cy="22" r="14" fill="#3fb950"/>
    <text x="28" y="27" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">RA</text>
    <text x="110" y="27" text-anchor="middle" fill="#f0f6fc" font-size="15" font-weight="500">Raw Archive</text>
  </g>

  <!-- Slide number -->
  <text x="1880" y="1050" text-anchor="end" fill="rgba(139,148,158,0.3)" font-size="14" font-weight="400">01 / 10</text>
</svg>
