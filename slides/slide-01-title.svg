<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Deep atmospheric background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090a"/>
      <stop offset="40%" stop-color="#0c0d0f"/>
      <stop offset="100%" stop-color="#08090a"/>
    </linearGradient>
    <!-- Subtle warm light from top-left -->
    <radialGradient id="light-warm" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="rgba(255,245,230,0.03)"/>
      <stop offset="100%" stop-color="rgba(255,245,230,0)"/>
    </radialGradient>
    <!-- Cool ambient from bottom-right -->
    <radialGradient id="light-cool" cx="80%" cy="85%" r="50%">
      <stop offset="0%" stop-color="rgba(180,200,220,0.02)"/>
      <stop offset="100%" stop-color="rgba(180,200,220,0)"/>
    </radialGradient>
    <!-- Glass card gradient -->
    <linearGradient id="glass-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <linearGradient id="glass-stroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>
    <!-- Subtle noise texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
      <feBlend in="SourceGraphic" in2="mono" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
    <!-- Depth shadow -->
    <filter id="shadow-deep" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
    <filter id="shadow-soft" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
    <!-- Text glow -->
    <filter id="text-glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#light-warm)"/>
  <rect width="1920" height="1080" fill="url(#light-cool)"/>

  <!-- Subtle horizontal line -->
  <line x1="320" y1="540" x2="1600" y2="540" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Main glass panel (hero card) -->
  <rect x="460" y="300" width="1000" height="480" rx="24" fill="url(#glass-fill)" stroke="url(#glass-stroke)" stroke-width="1" filter="url(#shadow-deep)"/>
  <!-- Top highlight -->
  <rect x="461" y="301" width="998" height="1" rx="0" fill="rgba(255,255,255,0.08)"/>

  <!-- Typography hierarchy -->
  <!-- Overline -->
  <text x="960" y="380" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="13" font-weight="400" letter-spacing="0.25em">SYSTEM ARCHITECTURE</text>

  <!-- Main title -->
  <text x="960" y="470" text-anchor="middle" fill="rgba(255,255,255,0.92)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="72" font-weight="200" letter-spacing="-0.02em">TickerLab</text>

  <!-- Subtitle -->
  <text x="960" y="540" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="300" letter-spacing="0.06em">Storage Architecture</text>

  <!-- Divider line -->
  <line x1="860" y1="580" x2="1060" y2="580" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Descriptor -->
  <text x="960" y="630" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="16" font-weight="400" letter-spacing="0.02em">Pragmatic infrastructure for financial intelligence</text>

  <!-- Minimal stats row -->
  <g transform="translate(610, 680)">
    <text x="0" y="0" fill="rgba(255,255,255,0.7)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="36" font-weight="200">2</text>
    <text x="0" y="22" fill="rgba(255,255,255,0.25)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="11" font-weight="400" letter-spacing="0.12em">STORAGE</text>
  </g>
  <line x1="730" y1="665" x2="730" y2="710" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <g transform="translate(790, 680)">
    <text x="0" y="0" fill="rgba(255,255,255,0.7)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="36" font-weight="200">5</text>
    <text x="0" y="22" fill="rgba(255,255,255,0.25)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="11" font-weight="400" letter-spacing="0.12em">LAYERS</text>
  </g>
  <line x1="900" y1="665" x2="900" y2="710" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <g transform="translate(960, 680)">
    <text x="0" y="0" fill="rgba(255,255,255,0.7)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="36" font-weight="200">16</text>
    <text x="0" y="22" fill="rgba(255,255,255,0.25)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="11" font-weight="400" letter-spacing="0.12em">TABLES</text>
  </g>
  <line x1="1090" y1="665" x2="1090" y2="710" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <g transform="translate(1150, 680)">
    <text x="0" y="0" fill="rgba(255,255,255,0.7)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="36" font-weight="200">12</text>
    <text x="0" y="22" fill="rgba(255,255,255,0.25)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="11" font-weight="400" letter-spacing="0.12em">SCHEMAS</text>
  </g>

  <!-- Bottom badge -->
  <text x="960" y="1030" text-anchor="middle" fill="rgba(255,255,255,0.12)" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif" font-size="11" font-weight="400" letter-spacing="0.15em">01</text>
</svg>
