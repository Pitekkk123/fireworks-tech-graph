<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090a"/>
      <stop offset="100%" stop-color="#0c0d0f"/>
    </linearGradient>
    <radialGradient id="atmo05" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.02)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="shadow05">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg05)"/>
  <rect width="1920" height="1080" fill="url(#atmo05)"/>

  <!-- Title -->
  <text x="960" y="80" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="400" fill="rgba(255,255,255,0.2)" letter-spacing="0.25em">INTERNAL ORGANIZATION</text>
  <text x="960" y="135" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="48" font-weight="200" fill="rgba(255,255,255,0.85)" letter-spacing="-0.01em">Schema Universe</text>
  <text x="960" y="175" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="16" font-weight="300" fill="rgba(255,255,255,0.3)">Twelve logical namespaces inside one PostgreSQL instance</text>

  <!-- Central ring -->
  <circle cx="960" cy="560" r="80" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
  <circle cx="960" cy="560" r="40" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="960" y="565" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="14" font-weight="300" fill="rgba(255,255,255,0.5)">PG</text>

  <!-- 12 schema nodes arranged radially -->
  <!-- 12 o'clock: sources -->
  <line x1="960" y1="480" x2="960" y2="310" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="960" y="290" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="20" font-weight="300" fill="rgba(255,255,255,0.7)">sources</text>
  <text x="960" y="312" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,0.2)">source_documents</text>

  <!-- 1 o'clock: market -->
  <line x1="1000" y1="490" x2="1220" y2="330" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="1240" y="320" text-anchor="start" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="20" font-weight="300" fill="rgba(255,255,255,0.7)">market</text>
  <text x="1240" y="342" text-anchor="start" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,0.2)">regime snapshots</text>

  <!-- 2 o'clock: sector -->
  <line x1="1030" y1="530" x2="1300" y2="440" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="1320" y="435" text-anchor="start" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="20" font-weight="300" fill="rgba(255,255,255,0.7)">sector</text>
  <text x="1320" y="457" text-anchor="start" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,0.2)">sector_snapshots, breadth, RS</text>

  <!-- 3 o'clock: leader -->
  <line x1="1040" y1="560" x2="1320" y2="560" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="1340" y="555" text-anchor="start" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="20" font-weight="300" fill="rgba(255,255,255,0.7)">leader</text>
  <text x="1340" y="577" text-anchor="start" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,0.2)">leader_snapshots, scores, tiers</text>

  <!-- 4 o'clock: setup -->
  <line x1="1030" y1="590" x2="1300" y2="680" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="1320" y="675" text-anchor="start" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="20" font-weight="300" fill="rgba(255,255,255,0.7)">setup</text>
  <text x="1320" y="697" text-anchor="start" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,0.2)">setup_diagnostics, 1B/2A/2B/2C</text>

  <!-- 5 o'clock: options -->
  <line x1="1000" y1="630" x2="1220" y2="790" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="1240" y="785" text-anchor="start" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="20" font-weight="300" fill="rgba(255,255,255,0.7)">options</text>
  <text x="1240" y="807" text-anchor="start" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,0.2)">contract_facts, daily_reads, pending</text>

  <!-- 6 o'clock: bottleneck -->
  <line x1="960" y1="640" x2="960" y2="860" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="960" y="890" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="20" font-weight="300" fill="rgba(255,255,255,0.7)">bottleneck</text>
  <text x="960" y="912" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,0.2)">scores, evidence, material exposure</text>

  <!-- 7 o'clock: research -->
  <line x1="920" y1="630" x2="700" y2="790" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="680" y="785" text-anchor="end" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="20" font-weight="300" fill="rgba(255,255,255,0.7)">research</text>
  <text x="680" y="807" text-anchor="end" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,0.2)">research_facts, claims, evidence</text>

  <!-- 8 o'clock: outcomes -->
  <line x1="890" y1="590" x2="620" y2="680" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="600" y="675" text-anchor="end" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="20" font-weight="300" fill="rgba(255,255,255,0.7)">outcomes</text>
  <text x="600" y="697" text-anchor="end" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,0.2)">signal_fires, signal_outcomes, pending</text>

  <!-- 9 o'clock: reports -->
  <line x1="880" y1="560" x2="600" y2="560" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="580" y="555" text-anchor="end" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="20" font-weight="300" fill="rgba(255,255,255,0.7)">reports</text>
  <text x="580" y="577" text-anchor="end" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,0.2)">report_snapshots, daily_brief</text>

  <!-- 10 o'clock: jobs -->
  <line x1="890" y1="530" x2="620" y2="440" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="600" y="435" text-anchor="end" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="20" font-weight="300" fill="rgba(255,255,255,0.7)">jobs</text>
  <text x="600" y="457" text-anchor="end" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,0.2)">job_runs, status, errors</text>

  <!-- 11 o'clock: memory -->
  <line x1="920" y1="490" x2="700" y2="330" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="680" y="320" text-anchor="end" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="20" font-weight="300" fill="rgba(255,255,255,0.7)">memory</text>
  <text x="680" y="342" text-anchor="end" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,0.2)">document_chunks, embeddings</text>

  <!-- Bottom -->
  <text x="960" y="1000" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="14" font-weight="300" fill="rgba(255,255,255,0.2)">Order without complexity. One database, twelve concerns.</text>
  <text x="960" y="1040" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="400" fill="rgba(255,255,255,0.12)" letter-spacing="0.15em">05</text>
</svg>
