<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg09" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090a"/>
      <stop offset="100%" stop-color="#0c0d0f"/>
    </linearGradient>
    <radialGradient id="atmo09" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.015)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <linearGradient id="glass09" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.045)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.012)"/>
    </linearGradient>
    <filter id="shadow09">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg09)"/>
  <rect width="1920" height="1080" fill="url(#atmo09)"/>

  <!-- Title -->
  <text x="960" y="70" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="400" fill="rgba(255,255,255,0.2)" letter-spacing="0.25em">EVOLUTION</text>
  <text x="960" y="120" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="44" font-weight="200" fill="rgba(255,255,255,0.85)">From MVP to Scale</text>
  <text x="960" y="158" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="15" font-weight="300" fill="rgba(255,255,255,0.25)">Add complexity only when real problems emerge</text>

  <!-- Timeline -->
  <line x1="200" y1="240" x2="1720" y2="240" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Dots -->
  <circle cx="380" cy="240" r="5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="760" cy="240" r="4" fill="rgba(255,255,255,0.2)"/>
  <circle cx="1140" cy="240" r="4" fill="rgba(255,255,255,0.15)"/>
  <circle cx="1520" cy="240" r="4" fill="rgba(255,255,255,0.1)"/>

  <!-- NOW label -->
  <text x="380" y="220" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="10" font-weight="400" fill="rgba(255,255,255,0.4)" letter-spacing="0.15em">NOW</text>

  <!-- Phase 1 Panel -->
  <g filter="url(#shadow09)">
    <rect x="200" y="280" width="360" height="680" rx="18" fill="url(#glass09)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <line x1="218" y1="280" x2="542" y2="280" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  </g>
  <text x="240" y="325" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="24" font-weight="200" fill="rgba(255,255,255,0.8)">Phase 1</text>
  <text x="240" y="355" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="15" font-weight="300" fill="rgba(255,255,255,0.4)">Postgres + Raw Archive</text>
  <line x1="240" y1="375" x2="520" y2="375" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="240" y="410" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.3)">12 schemas, 16 tables</text>
  <text x="240" y="435" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.3)">Raw file archive</text>
  <text x="240" y="460" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.3)">report_snapshots as views</text>
  <text x="240" y="485" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.3)">job_runs as state</text>
  <text x="240" y="510" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.3)">pending_outcomes in SQL</text>
  <text x="240" y="535" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.3)">document_chunks for retrieval</text>
  <text x="240" y="560" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.3)">ETL Agent pipeline</text>
  <text x="240" y="585" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.3)">CLI + API output</text>
  <text x="240" y="640" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,0.15)" letter-spacing="0.1em">NO REDIS. NO VECTOR DB.</text>

  <!-- Phase 2 Panel -->
  <g filter="url(#shadow09)">
    <rect x="590" y="280" width="340" height="680" rx="18" fill="url(#glass09)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <line x1="608" y1="280" x2="912" y2="280" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  </g>
  <text x="630" y="325" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="24" font-weight="200" fill="rgba(255,255,255,0.6)">Phase 2</text>
  <text x="630" y="355" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="15" font-weight="300" fill="rgba(255,255,255,0.3)">+ pgvector</text>
  <line x1="630" y1="375" x2="890" y2="375" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <text x="630" y="410" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,0.2)" letter-spacing="0.08em">TRIGGER</text>
  <text x="630" y="435" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.25)">Need semantic search</text>
  <text x="630" y="455" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.25)">across research notes</text>
  <text x="630" y="500" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,0.2)" letter-spacing="0.08em">ADD</text>
  <text x="630" y="525" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.25)">pgvector extension</text>
  <text x="630" y="545" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.25)">Embedding column</text>
  <text x="630" y="565" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.25)">Vector similarity</text>
  <text x="630" y="610" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,0.15)">Still one database.</text>

  <!-- Phase 3 Panel -->
  <g filter="url(#shadow09)">
    <rect x="960" y="280" width="340" height="680" rx="18" fill="url(#glass09)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <line x1="978" y1="280" x2="1282" y2="280" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  </g>
  <text x="1000" y="325" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="24" font-weight="200" fill="rgba(255,255,255,0.45)">Phase 3</text>
  <text x="1000" y="355" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="15" font-weight="300" fill="rgba(255,255,255,0.25)">+ Redis / Upstash</text>
  <line x1="1000" y1="375" x2="1260" y2="375" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <text x="1000" y="410" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,0.2)" letter-spacing="0.08em">TRIGGER</text>
  <text x="1000" y="435" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.25)">Dashboard too slow</text>
  <text x="1000" y="455" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.25)">Concurrent read pressure</text>
  <text x="1000" y="500" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,0.2)" letter-spacing="0.08em">ADD (only)</text>
  <text x="1000" y="525" font-family="'SF Mono','JetBrains Mono',monospace" font-size="11" font-weight="300" fill="rgba(255,255,255,0.2)">tl:view:daily-brief:latest</text>
  <text x="1000" y="545" font-family="'SF Mono','JetBrains Mono',monospace" font-size="11" font-weight="300" fill="rgba(255,255,255,0.2)">tl:view:sector-top5:latest</text>
  <text x="1000" y="565" font-family="'SF Mono','JetBrains Mono',monospace" font-size="11" font-weight="300" fill="rgba(255,255,255,0.2)">tl:lock:daily-refresh</text>
  <text x="1000" y="610" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,0.15)">Cache only. Not the truth.</text>

  <!-- Phase 4 Panel -->
  <g filter="url(#shadow09)">
    <rect x="1330" y="280" width="340" height="680" rx="18" fill="url(#glass09)" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    <line x1="1348" y1="280" x2="1652" y2="280" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
  </g>
  <text x="1370" y="325" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="24" font-weight="200" fill="rgba(255,255,255,0.3)">Phase 4</text>
  <text x="1370" y="355" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="15" font-weight="300" fill="rgba(255,255,255,0.2)">+ Vector DB</text>
  <line x1="1370" y1="375" x2="1630" y2="375" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <text x="1370" y="410" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,0.15)" letter-spacing="0.08em">TRIGGER</text>
  <text x="1370" y="435" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.2)">pgvector outgrown</text>
  <text x="1370" y="455" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.2)">Advanced hybrid search</text>
  <text x="1370" y="475" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.2)">Multiple agent memory</text>
  <text x="1370" y="520" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,0.15)" letter-spacing="0.08em">OPTIONS</text>
  <text x="1370" y="545" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.2)">Pinecone / Qdrant / Weaviate</text>
  <text x="1370" y="590" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="300" fill="rgba(255,255,255,0.12)">Retrieval only. Postgres stays.</text>

  <text x="960" y="1040" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="400" fill="rgba(255,255,255,0.12)" letter-spacing="0.15em">09</text>
</svg>
