<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg09" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="50%" stop-color="#14110e"/>
      <stop offset="100%" stop-color="#110f0c"/>
    </linearGradient>
    <radialGradient id="glow09a" cx="25%" cy="40%" r="45%">
      <stop offset="0%" stop-color="rgba(217,119,87,0.05)"/>
      <stop offset="100%" stop-color="rgba(217,119,87,0)"/>
    </radialGradient>
    <radialGradient id="glow09b" cx="75%" cy="60%" r="45%">
      <stop offset="0%" stop-color="rgba(217,119,87,0.04)"/>
      <stop offset="100%" stop-color="rgba(217,119,87,0)"/>
    </radialGradient>
    <linearGradient id="cardGrad09" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(245,240,235,0.05)"/>
      <stop offset="100%" stop-color="rgba(245,240,235,0.015)"/>
    </linearGradient>
    <linearGradient id="cardGrad09active" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(217,119,87,0.06)"/>
      <stop offset="100%" stop-color="rgba(217,119,87,0.02)"/>
    </linearGradient>
    <filter id="cardShadow09">
      <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="rgba(10,8,6,0.5)"/>
    </filter>
    <linearGradient id="timelineGrad09" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(217,119,87,0.03)"/>
      <stop offset="15%" stop-color="rgba(217,119,87,0.2)"/>
      <stop offset="50%" stop-color="rgba(217,119,87,0.1)"/>
      <stop offset="85%" stop-color="rgba(217,119,87,0.04)"/>
      <stop offset="100%" stop-color="rgba(217,119,87,0.02)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg09)"/>
  <rect width="1920" height="1080" fill="url(#glow09a)"/>
  <rect width="1920" height="1080" fill="url(#glow09b)"/>

  <!-- Title -->
  <text x="960" y="90" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="38" fill="rgba(245,240,235,0.9)" letter-spacing="0.02em">Evolution Roadmap</text>
  <text x="960" y="128" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="15" fill="rgba(245,240,235,0.3)">Add complexity only when pain is real</text>

  <!-- Timeline line -->
  <line x1="220" y1="220" x2="1700" y2="220" stroke="url(#timelineGrad09)" stroke-width="1"/>

  <!-- Phase 1 dot - NOW (emphasized) -->
  <circle cx="410" cy="220" r="6" fill="none" stroke="rgba(217,119,87,0.3)" stroke-width="1"/>
  <circle cx="410" cy="220" r="2.5" fill="#D97757"/>
  <!-- Phase 2 dot -->
  <circle cx="770" cy="220" r="4" fill="rgba(217,119,87,0.2)"/>
  <!-- Phase 3 dot -->
  <circle cx="1130" cy="220" r="4" fill="rgba(217,119,87,0.12)"/>
  <!-- Phase 4 dot -->
  <circle cx="1490" cy="220" r="4" fill="rgba(217,119,87,0.07)"/>

  <!-- NOW label -->
  <text x="410" y="198" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="500" font-size="10" fill="#D97757" letter-spacing="0.3em">NOW</text>

  <!-- Connector lines from dots to panels -->
  <line x1="410" y1="226" x2="410" y2="280" stroke="rgba(217,119,87,0.12)" stroke-width="0.5"/>
  <line x1="770" y1="224" x2="770" y2="280" stroke="rgba(217,119,87,0.06)" stroke-width="0.5"/>
  <line x1="1130" y1="224" x2="1130" y2="280" stroke="rgba(217,119,87,0.05)" stroke-width="0.5"/>
  <line x1="1490" y1="224" x2="1490" y2="280" stroke="rgba(217,119,87,0.05)" stroke-width="0.5"/>

  <!-- Phase 1 Panel - NOW / Active treatment -->
  <rect x="270" y="280" width="280" height="560" rx="18" fill="url(#cardGrad09active)" stroke="rgba(217,119,87,0.12)" stroke-width="0.5" filter="url(#cardShadow09)"/>
  <line x1="288" y1="280.5" x2="532" y2="280.5" stroke="rgba(245,240,235,0.04)" stroke-width="1"/>

  <text x="410" y="325" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="500" font-size="11" fill="#D97757" letter-spacing="0.2em">PHASE 1</text>
  <text x="410" y="365" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="22" fill="rgba(245,240,235,0.92)">Postgres + Raw</text>

  <text x="305" y="430" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="500" font-size="10" fill="#D97757" letter-spacing="0.2em">TRIGGER</text>
  <line x1="305" y1="440" x2="380" y2="440" stroke="rgba(217,119,87,0.06)" stroke-width="0.5"/>
  <text x="305" y="465" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="14" fill="rgba(245,240,235,0.7)">Day zero.</text>
  <text x="305" y="488" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="14" fill="rgba(245,240,235,0.7)">Start here always.</text>
  <text x="305" y="518" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="12" fill="rgba(245,240,235,0.3)">Single database handles</text>
  <text x="305" y="536" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="12" fill="rgba(245,240,235,0.3)">all workloads.</text>

  <text x="305" y="590" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="500" font-size="10" fill="#D97757" letter-spacing="0.2em">WHAT</text>
  <line x1="305" y1="600" x2="355" y2="600" stroke="rgba(217,119,87,0.06)" stroke-width="0.5"/>
  <text x="305" y="625" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="14" fill="rgba(245,240,235,0.7)">6 schemas</text>
  <text x="305" y="650" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="14" fill="rgba(245,240,235,0.7)">JSONB snapshots</text>
  <text x="305" y="675" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="14" fill="rgba(245,240,235,0.7)">Trigram text search</text>
  <text x="305" y="700" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="14" fill="rgba(245,240,235,0.7)">SQL cron jobs</text>

  <!-- Phase 2 Panel -->
  <rect x="630" y="280" width="280" height="560" rx="18" fill="url(#cardGrad09)" stroke="rgba(217,119,87,0.08)" stroke-width="0.5" filter="url(#cardShadow09)"/>
  <line x1="648" y1="280.5" x2="892" y2="280.5" stroke="rgba(245,240,235,0.04)" stroke-width="1"/>

  <text x="770" y="325" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="500" font-size="11" fill="rgba(217,119,87,0.6)" letter-spacing="0.2em">PHASE 2</text>
  <text x="770" y="365" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="22" fill="rgba(245,240,235,0.7)">+ pgvector</text>

  <text x="665" y="430" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="500" font-size="10" fill="rgba(217,119,87,0.5)" letter-spacing="0.2em">TRIGGER</text>
  <line x1="665" y1="440" x2="740" y2="440" stroke="rgba(217,119,87,0.05)" stroke-width="0.5"/>
  <text x="665" y="465" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="14" fill="rgba(245,240,235,0.7)">Trigram recall drops</text>
  <text x="665" y="488" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="14" fill="rgba(245,240,235,0.7)">below 70% on research</text>
  <text x="665" y="511" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="14" fill="rgba(245,240,235,0.7)">queries.</text>

  <text x="665" y="590" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="500" font-size="10" fill="rgba(217,119,87,0.5)" letter-spacing="0.2em">WHAT</text>
  <line x1="665" y1="600" x2="715" y2="600" stroke="rgba(217,119,87,0.05)" stroke-width="0.5"/>
  <text x="665" y="625" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="14" fill="rgba(245,240,235,0.7)">Embedding column on</text>
  <text x="665" y="650" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="14" fill="rgba(245,240,235,0.7)">document_chunks</text>
  <text x="665" y="675" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="14" fill="rgba(245,240,235,0.7)">Same table, new index</text>
  <text x="665" y="700" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="14" fill="rgba(245,240,235,0.7)">No new service</text>

  <!-- Phase 3 Panel -->
  <rect x="990" y="280" width="280" height="560" rx="18" fill="url(#cardGrad09)" stroke="rgba(217,119,87,0.08)" stroke-width="0.5" filter="url(#cardShadow09)"/>
  <line x1="1008" y1="280.5" x2="1252" y2="280.5" stroke="rgba(245,240,235,0.04)" stroke-width="1"/>

  <text x="1130" y="325" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="500" font-size="11" fill="rgba(217,119,87,0.45)" letter-spacing="0.2em">PHASE 3</text>
  <text x="1130" y="365" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="22" fill="rgba(245,240,235,0.7)">+ Redis / Upstash</text>

  <text x="1025" y="430" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="500" font-size="10" fill="rgba(217,119,87,0.4)" letter-spacing="0.2em">TRIGGER</text>
  <line x1="1025" y1="440" x2="1100" y2="440" stroke="rgba(217,119,87,0.05)" stroke-width="0.5"/>
  <text x="1025" y="465" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="14" fill="rgba(245,240,235,0.7)">Dashboard p95 latency</text>
  <text x="1025" y="488" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="14" fill="rgba(245,240,235,0.7)">exceeds 200ms on</text>
  <text x="1025" y="511" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="14" fill="rgba(245,240,235,0.7)">snapshot reads.</text>

  <text x="1025" y="590" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="500" font-size="10" fill="rgba(217,119,87,0.4)" letter-spacing="0.2em">WHAT</text>
  <line x1="1025" y1="600" x2="1075" y2="600" stroke="rgba(217,119,87,0.05)" stroke-width="0.5"/>
  <text x="1025" y="625" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="14" fill="rgba(245,240,235,0.7)">Read-through cache for</text>
  <text x="1025" y="650" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="14" fill="rgba(245,240,235,0.7)">report_snapshots</text>
  <text x="1025" y="675" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="14" fill="rgba(245,240,235,0.7)">Postgres stays source</text>
  <text x="1025" y="700" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="14" fill="rgba(245,240,235,0.7)">of truth</text>

  <!-- Phase 4 Panel -->
  <rect x="1350" y="280" width="280" height="560" rx="18" fill="url(#cardGrad09)" stroke="rgba(217,119,87,0.08)" stroke-width="0.5" filter="url(#cardShadow09)"/>
  <line x1="1368" y1="280.5" x2="1612" y2="280.5" stroke="rgba(245,240,235,0.04)" stroke-width="1"/>

  <text x="1490" y="325" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="500" font-size="11" fill="rgba(217,119,87,0.35)" letter-spacing="0.2em">PHASE 4</text>
  <text x="1490" y="365" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="22" fill="rgba(245,240,235,0.7)">+ Vector DB</text>

  <text x="1385" y="430" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="500" font-size="10" fill="rgba(217,119,87,0.3)" letter-spacing="0.2em">TRIGGER</text>
  <line x1="1385" y1="440" x2="1460" y2="440" stroke="rgba(217,119,87,0.05)" stroke-width="0.5"/>
  <text x="1385" y="465" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="14" fill="rgba(245,240,235,0.7)">Document corpus exceeds</text>
  <text x="1385" y="488" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="14" fill="rgba(245,240,235,0.7)">500k chunks. pgvector</text>
  <text x="1385" y="511" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="14" fill="rgba(245,240,235,0.7)">index rebuild too slow.</text>

  <text x="1385" y="590" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="500" font-size="10" fill="rgba(217,119,87,0.3)" letter-spacing="0.2em">WHAT</text>
  <line x1="1385" y1="600" x2="1435" y2="600" stroke="rgba(217,119,87,0.05)" stroke-width="0.5"/>
  <text x="1385" y="625" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="14" fill="rgba(245,240,235,0.7)">Dedicated vector store</text>
  <text x="1385" y="650" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="14" fill="rgba(245,240,235,0.7)">Pinecone or Qdrant</text>
  <text x="1385" y="675" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="14" fill="rgba(245,240,235,0.7)">Sync from Postgres</text>
  <text x="1385" y="700" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="14" fill="rgba(245,240,235,0.7)">Embeddings offloaded</text>

  <!-- Slide number -->
  <text x="960" y="1050" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-weight="200" font-size="14" fill="rgba(217,119,87,0.25)" letter-spacing="0.15em">09 / 10</text>
</svg>