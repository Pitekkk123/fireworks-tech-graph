<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg07" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090a"/>
      <stop offset="100%" stop-color="#0c0d0f"/>
    </linearGradient>
    <radialGradient id="atmo07" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.02)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <linearGradient id="glass07" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.04)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.012)"/>
    </linearGradient>
    <filter id="shadow07">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg07)"/>
  <rect width="1920" height="1080" fill="url(#atmo07)"/>

  <!-- Title -->
  <text x="960" y="70" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="400" fill="rgba(255,255,255,0.2)" letter-spacing="0.25em">PIPELINE</text>
  <text x="960" y="120" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="44" font-weight="200" fill="rgba(255,255,255,0.85)">Ingest &amp; Report Porter</text>
  <text x="960" y="160" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="15" font-weight="300" fill="rgba(255,255,255,0.25)">Deterministic ETL worker. Not a memory agent.</text>

  <!-- Horizontal flow line -->
  <line x1="140" y1="360" x2="1780" y2="360" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- 7 Steps -->
  <!-- Step 1 -->
  <g transform="translate(140, 220)">
    <text x="0" y="0" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="64" font-weight="100" fill="rgba(255,255,255,0.06)">01</text>
    <text x="0" y="55" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="17" font-weight="400" fill="rgba(255,255,255,0.7)">File Arrives</text>
    <text x="0" y="78" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.25)">TradingEdge, SEC,</text>
    <text x="0" y="94" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.25)">CSV, news, notes</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(380, 220)">
    <text x="0" y="0" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="64" font-weight="100" fill="rgba(255,255,255,0.06)">02</text>
    <text x="0" y="55" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="17" font-weight="400" fill="rgba(255,255,255,0.7)">Save Raw</text>
    <text x="0" y="78" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.25)">Write full file to</text>
    <text x="0" y="94" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.25)">raw archive + SHA-256</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(620, 220)">
    <text x="0" y="0" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="64" font-weight="100" fill="rgba(255,255,255,0.06)">03</text>
    <text x="0" y="55" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="17" font-weight="400" fill="rgba(255,255,255,0.7)">Register Source</text>
    <text x="0" y="78" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.25)">INSERT source_documents</text>
    <text x="0" y="94" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.25)">URI, hash, metadata</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(880, 220)">
    <text x="0" y="0" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="64" font-weight="100" fill="rgba(255,255,255,0.06)">04</text>
    <text x="0" y="55" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="17" font-weight="400" fill="rgba(255,255,255,0.7)">Parse &amp; Validate</text>
    <text x="0" y="78" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.25)">Identify module, extract</text>
    <text x="0" y="94" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.25)">structured data, check</text>
  </g>

  <!-- Step 5 -->
  <g transform="translate(1150, 220)">
    <text x="0" y="0" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="64" font-weight="100" fill="rgba(255,255,255,0.06)">05</text>
    <text x="0" y="55" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="17" font-weight="400" fill="rgba(255,255,255,0.7)">Write Facts</text>
    <text x="0" y="78" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.25)">INSERT into canonical</text>
    <text x="0" y="94" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.25)">fact tables by module</text>
  </g>

  <!-- Step 6 -->
  <g transform="translate(1400, 220)">
    <text x="0" y="0" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="64" font-weight="100" fill="rgba(255,255,255,0.06)">06</text>
    <text x="0" y="55" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="17" font-weight="400" fill="rgba(255,255,255,0.7)">Report Snapshot</text>
    <text x="0" y="78" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.25)">Build daily_brief JSON</text>
    <text x="0" y="94" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.25)">Frontend reads one row</text>
  </g>

  <!-- Step 7 -->
  <g transform="translate(1660, 220)">
    <text x="0" y="0" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="64" font-weight="100" fill="rgba(255,255,255,0.06)">07</text>
    <text x="0" y="55" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="17" font-weight="400" fill="rgba(255,255,255,0.7)">Complete</text>
    <text x="0" y="78" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.25)">Update job_runs,</text>
    <text x="0" y="94" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="12" font-weight="300" fill="rgba(255,255,255,0.25)">add pending outcomes</text>
  </g>

  <!-- Two example panels -->
  <g filter="url(#shadow07)">
    <rect x="140" y="430" width="780" height="300" rx="18" fill="url(#glass07)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <line x1="158" y1="430" x2="902" y2="430" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </g>
  <text x="180" y="470" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="14" font-weight="400" fill="rgba(255,255,255,0.45)" letter-spacing="0.08em">EXAMPLE: OPTIONS FLOW</text>
  <text x="180" y="510" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.3)">1. TradingEdge HTML arrives</text>
  <text x="180" y="535" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.3)">2. Save to raw/2026-05-25/tradingedge.html</text>
  <text x="180" y="560" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.3)">3. Register source_document with SHA-256</text>
  <text x="180" y="585" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.3)">4. Parse contracts: strike, volume, premium, OI</text>
  <text x="180" y="610" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.3)">5. Write options_contract_facts + daily_reads</text>
  <text x="180" y="635" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.3)">6. Create pending_oi_checks for next session</text>
  <text x="180" y="660" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.3)">7. Refresh report_snapshots</text>

  <g filter="url(#shadow07)">
    <rect x="980" y="430" width="780" height="300" rx="18" fill="url(#glass07)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <line x1="998" y1="430" x2="1742" y2="430" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </g>
  <text x="1020" y="470" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="14" font-weight="400" fill="rgba(255,255,255,0.45)" letter-spacing="0.08em">EXAMPLE: SEC / BOTTLENECK</text>
  <text x="1020" y="510" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.3)">1. SEC 10-K filing arrives for ticker MP</text>
  <text x="1020" y="535" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.3)">2. Save to raw/2026-05-25/sec-mp-10k.html</text>
  <text x="1020" y="560" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.3)">3. Register source_document, identify CIK</text>
  <text x="1020" y="585" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.3)">4. Extract material exposure claims</text>
  <text x="1020" y="610" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.3)">5. Write bottleneck_evidence with confidence</text>
  <text x="1020" y="635" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.3)">6. Recalculate bottleneck_company_scores</text>
  <text x="1020" y="660" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="13" font-weight="300" fill="rgba(255,255,255,0.3)">7. Update daily brief section</text>

  <!-- Bottom statement -->
  <text x="960" y="820" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="18" font-weight="300" fill="rgba(255,255,255,0.35)">Extract. Transform. Load.</text>
  <text x="960" y="850" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="14" font-weight="300" fill="rgba(255,255,255,0.2)">A controlled pipeline, not an autonomous brain.</text>

  <text x="960" y="1040" text-anchor="middle" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="11" font-weight="400" fill="rgba(255,255,255,0.12)" letter-spacing="0.15em">07</text>
</svg>
