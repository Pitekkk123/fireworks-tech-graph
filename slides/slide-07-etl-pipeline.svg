  <text x="160" y="100" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="52" font-weight="200" fill="rgba(245,240,235,0.90)" letter-spacing="-0.03em">ETL Pipeline</text>
  <text x="160" y="136" font-family="'SF Pro Display','Inter',-apple-system,sans-serif" font-size="14" font-weight="500" fill="#D97757" letter-spacing="0.25em">DETERMINISTIC INGEST  /  7 STEPS  /  NO MAGIC</text>

